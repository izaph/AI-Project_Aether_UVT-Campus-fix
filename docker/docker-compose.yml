services:
  glpi:
    image: diouxx/glpi:latest
    ports:
      - "8080:80"
    volumes:
      - ../plugin:/var/www/html/glpi/plugins/uvtcampusfix
      - glpi-data:/var/www/html/glpi
      - glpi-files:/var/www/html/glpi/files
    depends_on:
      - db
      - ml-service

  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: glpi
      MYSQL_USER: glpi
      MYSQL_PASSWORD: glpi
    volumes:
      - db-data:/var/lib/mysql

  ml-service:
    build:
      context: ../ml-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

volumes:
  glpi-data:
  glpi-files:
  db-data:
