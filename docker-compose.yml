version: "3.8"

services:
  glpi:
    image: diouxx/glpi:latest
    ports:
      - "8080:80"
    volumes:
      - ./plugin:/var/www/html/glpi/plugins/uvtcampusfix
      - glpi-files:/var/www/html/glpi/files
    depends_on:
      - db

  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: glpi
      MYSQL_USER: glpi
      MYSQL_PASSWORD: glpi
    volumes:
      - db-data:/var/lib/mysql

  ml-service:
    build: ../ml-service
    ports:
      - "8000:8000"

volumes:
  glpi-files:
  db-data:
